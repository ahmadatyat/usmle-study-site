name: Verify published step1tasks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-published-step1tasks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify live release and changed routes
        run: |
          python3 - <<'PY'
          import hashlib,json,re,time,urllib.request
          from pathlib import Path
          expected=json.loads(Path('deployment.json').read_text())
          base='https://ahmadatyat.github.io/usmle-study-site/'
          def read(path):
            req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'step1tasks-publication-check'})
            with urllib.request.urlopen(req,timeout=30) as response:
              return response.read()
          for attempt in range(48):
            try:
              actual=json.loads(read('deployment.json?verify='+expected['sourceRevision']))
              assert actual['sourceRevision']==expected['sourceRevision'],'Live site still serves another release'
              assert actual['accountsEnabled'] is True,'Account configuration missing'
              integrity=json.loads(Path('release-integrity.json').read_text())
              route_assets=set()
              for route in ['dashboard/','calendar/','plan/','flashcards/','question-bank/','questions/','bookshelf/','library/','settings/','resources/','team/','experiences/']:
                html=read(route+'?verify='+expected['sourceRevision'])
                item=integrity['files'][route+'index.html']
                assert hashlib.sha256(html).hexdigest()==item['sha256'],'Live HTML differs: '+route
                for src in re.findall(r'<script[^>]+src="([^"]+)"',html.decode()):
                  if src.startswith('/usmle-study-site/_next/static/'):
                    route_assets.add(src.removeprefix('/usmle-study-site/').split('?')[0])
              for name in ['admin-dashboard/index.html','admin-dashboard/bookshop.js','admin-dashboard/app.js']:
                data=read(name+'?verify='+expected['sourceRevision'])
                assert hashlib.sha256(data).hexdigest()==integrity['files'][name]['sha256'],'Live admin differs: '+name
              assets=[(name,integrity['files'][name]) for name in sorted(route_assets)]
              assert assets,'Release has no application bundles'
              for name,item in assets:
                data=read(name)
                assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256'],'Live asset differs: '+name
              print('Verified live release',actual['sourceRevision'],'with accounts, twelve routes, bookshelf management and all route application bundles.')
              break
            except Exception as error:
              if attempt==47: raise
              print('Waiting for Pages/CDN:',str(error))
              time.sleep(10)
          PY
