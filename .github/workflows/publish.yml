name: Publish step1tasks
on:
  # Pages is configured to deploy main with its built-in workflow. Keep this
  # verified publisher manual until an owner switches Pages to GitHub Actions;
  # enabling both push paths uploads the whole site twice per release.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: studywell-pages-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify complete release files
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const manifest = JSON.parse(readFileSync('release-integrity.json', 'utf8'));
          if (manifest.version !== 1 || !Object.keys(manifest.files ?? {}).length) throw new Error('Missing release integrity manifest');
          for (const [path, expected] of Object.entries(manifest.files)) {
            if (path.startsWith('/') || path.split('/').includes('..')) throw new Error('Invalid release path');
            const data = readFileSync(path);
            if (data.length !== expected.bytes || createHash('sha256').update(data).digest('hex') !== expected.sha256) throw new Error('Incomplete release asset: ' + path);
          }
          console.log('All release assets match the build.');
          NODE
      - name: Upload tested static website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
          retention-days: 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          timeout: 1800000 # v5
