hat you will understand what you study,\"}],[\"$\",\"p\",\"7\",{\"dir\":\"auto\",\"children\":\"As to Biostats and Ethics: Randy Neil is highly recommended for biostats, Dirty Medicine is highly recommended for ethics (Communication skills and insurance programms videos),\"}],[\"$\",\"p\",\"8\",{\"dir\":\"auto\",\"children\":\"Communication skills questions on Uworld are extremely difficult and confusing, the real exam ones are much much easier!\"}],\"$L24\",\"$L25\",\"$L26\",\"$L27\",\"$L28\",\"$L29\",\"$L2a\",\"$L2b\",\"$L2c\",\"$L2d\",\"$L2e\",\"$L2f\",\"$L30\",\"$L31\",\"$L32\",\"$L33\",\"$L34\",\"$L35\",\"$L36\",\"$L37\"]}],\"$L38\",\"$L39\",\"$L3a\"]}]}]\n"])</script><script>self.__next_f.push([1,"3b:I[78322,[\"7879\",\"static/chunks/30c204f0-e9ad381c04333254.js\",\"2956\",\"static/chunks/2956-71b33fee22e75ab7.js\",\"415\",\"static/chunks/415-37f7667d6193b75d.js\",\"8232\",\"static/chunks/8232-01ca9ec37b41df0f.js\",\"9553\",\"static/chunks/9553-3a71279c0a806d70.js\",\"9779\",\"static/chunks/9779-8c0aa1eadaef0bc6.js\",\"8621\",\"static/chunks/8621-2c9cae303b642f48.js\",\"2588\",\"static/chunks/2588-96eee98f83a19c21.js\",\"9560\",\"static/chunks/app/experiences/%5Bslug%5D/page-e7f8877e146cc361.js\"],\"LongPageControls\"]\n24:[\"$\",\"p\",\"9\",{\"dir\":\"auto\",\"children\":\"Uworld: one run, 86% correct (whether you score higher or lower, this score doesn't really matter since Uworld is not an assessment tool, as long as you learn from your mistakes, you are good), questions done non-randomly by system, 10-15 questions per block is preferable so you don't get burnt out. 40-60 questions a day is not a bad number.\"}]\n25:[\"$\",\"p\",\"10\",{\"dir\":\"auto\",\"children\":\"Self assessments (I was considering any score above 70-80% to be safe for me)\"}]\n26:[\"$\",\"p\",\"11\",{\"dir\":\"auto\",\"children\":\"1. NBME Form 31: 90% (4 weeks out)\"}]\n27:[\"$\",\"p\",\"12\",{\"dir\":\"auto\",\"children\":\"2. NBME Form 30: 88% (1-2 weeks out)\"}]\n28:[\"$\",\"p\",\"13\",{\"dir\":\"auto\",\"children\":\"3. UWSA1: 269 (1-2 weeks out)\"}]\n29:[\"$\",\"p\",\"14\",{\"dir\":\"auto\",\"children\":\"4. UWSA2: 261 (1-2 weeks out)\"}]\n2a:[\"$\",\"p\",\"15\",{\"dir\":\"auto\",\"children\":\"5. New Free120: 88% (4 days out)\"}]\n2b:[\"$\",\"h2\",\"16\",{\"dir\":\"auto\",\"children\":\"The real exam vs self-assessments:\"}]\n2c:[\"$\",\"p\",\"17\",{\"dir\":\"auto\",\"children\":\"The real exam in general had longer questions than NBME (more similar to Uworld's style), less clues, but is still not really that hard. And in some questions you will not be confident about your answer choice.\"}]\n2d:[\"$\",\"p\",\"18\",{\"dir\":\"auto\",\"children\":\"The time given per block is really enough, don't worry about that.\"}]\n2e:[\"$\",\"p\",\"19\",{\"dir\":\"auto\",\"children\":\"There were audio-based questions.\"}]\n2f:[\"$\",\"p\",\"20\",{\"dir\":\"auto\",\"children\":\"I flagged 12 questions per block on average, this made me a bit uncomfo"])</script><script>self.__next_f.push([1,"rtable throughout the exam since I took it as if a flagged question meant I got it wrong, but that wasn't really the case (since at least half the questions I flagged in my assessments turned out to be answered correctly, so keep this in your consideration)\"}]\n30:[\"$\",\"p\",\"21\",{\"dir\":\"auto\",\"children\":\"Last two blocks were noticeably more difficult, I read that some examinees experienced this before, so don't panic if you happen to face the same issue. There will be some questions that you will have no idea what are they even about, don't panic as well, they are few and they might even be ungraded questions.\"}]\n31:[\"$\",\"h2\",\"22\",{\"dir\":\"auto\",\"children\":\"To sum up my exam experience in a couple of advices:\"}]\n32:[\"$\",\"p\",\"23\",{\"dir\":\"auto\",\"children\":\"1. The exam questions are only slightly harder than self-assesment ones, be prepared for this\"}]\n33:[\"$\",\"p\",\"24\",{\"dir\":\"auto\",\"children\":\"2. practice to read questions carefully and faster (reading the last line of a question didn't really work for me during the exam so I gave up on it)\"}]\n34:[\"$\",\"p\",\"25\",{\"dir\":\"auto\",\"children\":\"3. Use the HIGHLIGHTER, highlight the most important clues as you read the question so you don't waste time reading it again\"}]\n35:[\"$\",\"p\",\"26\",{\"dir\":\"auto\",\"children\":\"4. Vitals are almost included in every question and aren't always pertinent, highlight the ones that don't fall within the normal reference range\"}]\n36:[\"$\",\"p\",\"27\",{\"dir\":\"auto\",\"children\":\"5. Personally, I don't recommend using the strikethrough tool (used to rule out answer options) at first glimpse, as this might get you trapped among wrong answers\"}]\n37:[\"$\",\"p\",\"28\",{\"dir\":\"auto\",\"children\":\"Good luck everyone\"}]\n38:[\"$\",\"nav\",null,{\"className\":\"experiences_next__S7L_m\",\"aria-label\":\"More student experiences\",\"children\":[[\"$\",\"a\",null,{\"children\":\"← Browse all stories\",\"href\":\"/usmle-study-site/experiences/\"}],[\"$\",\"a\",null,{\"children\":[\"Next: \",\"Abdallah Dababseh\",\" →\"],\"href\":\"/usmle-study-site/experiences/abdallah-dababseh/\"}]]}]\n"])</script><script>self.__next_f.push([1,"39:[\"$\",\"footer\",null,{\"className\":\"experiences_footer___em3T\",\"children\":[[\"$\",\"h2\",null,{\"children\":\"Read with perspective\"}],[\"$\",\"p\",null,{\"children\":\"These student experiences are shared for educational benefit and peer support only. They are personal, self-reported opinions—not independently verified results, official guidance, medical advice, or a guarantee of passing. Preparation times, scores, resources, exam formats, scheduling rules, and policies may have changed. Historical numerical scores are not current passing thresholds. Do not use anecdotes to decide readiness or to take medication; consult qualified professionals when appropriate.\"}],[\"$\",\"p\",null,{\"children\":\"step1tasks is independent and i
